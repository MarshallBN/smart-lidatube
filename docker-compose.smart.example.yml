services:
  lidatube:
    build: .
    env_file: .env
    volumes:
      - ./config:/lidatube/config
      # This same host path must be visible to Lidarr.
      - /data/media/lidatube:/lidatube/downloads
    ports: ["5000:5000"]
    restart: unless-stopped

  # One sidecar only: do not run the poller in each Gunicorn web worker.
  smart-worker:
    build: .
    env_file: .env
    environment:
      SMART_WORKER: "true"
      DOWNLOADS_ROOT: /lidatube/downloads
      # Path to this same host volume from Lidarr's container (no Lidarr service
      # or mount is required in this example).
      LIDARR_DOWNLOADS_ROOT: /lidatube/downloads
    volumes:
      - ./config:/lidatube/config
      - /data/media/lidatube:/lidatube/downloads
    # Override the image's web HTTP probe: this process has no HTTP server.
    healthcheck:
      test: ["CMD", "python", "-m", "smart_lidatube.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
